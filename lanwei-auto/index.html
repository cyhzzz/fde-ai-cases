<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
  body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; background: #F4F5F7; color: #1F2937; line-height: 1.7; overflow-x: hidden; }
  ::selection { background: rgba(22,84,140,0.15); }
  .font-serif { font-family: 'Noto Serif SC', Georgia, 'Songti SC', serif; }

  /* ===== NAV ===== */
  .nav-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(255,255,255,0.93); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(0,0,0,0.06); transition: box-shadow 0.3s; }
  .nav-bar.scrolled { box-shadow: 0 1px 14px rgba(0,0,0,0.07); }
  .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 24px 0 20px; height: 62px; }
  .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-mark { width: 26px; height: 26px; border-radius: 6px; background: #16548C; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .nav-mark svg { display: block; }
  .nav-logo-name { font-size: 15px; color: #1F2937; font-weight: 600; letter-spacing: 0.02em; }
  .nav-logo-sub { font-size: 12px; color: #9CA3AF; font-weight: 400; margin-left: 2px; }
  .nav-links { display: flex; gap: 22px; }
  .nav-links a { font-size: 13px; color: #6B7280; text-decoration: none; transition: color 0.2s; white-space: nowrap; }
  .nav-links a:hover { color: #16548C; }

  /* ===== SECTION COMMON ===== */
  .section { max-width: 1200px; margin: 0 auto; padding: 100px 40px; }
  .section-label { font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #16548C; margin-bottom: 16px; }
  .section-title { font-family: 'Noto Serif SC', serif; font-size: 34px; font-weight: 700; color: #111827; line-height: 1.38; margin-bottom: 20px; }
  .section-subtitle { font-size: 16px; color: #6B7280; line-height: 1.85; max-width: 720px; }
  .section-divider { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
  .section-divider hr { border: none; height: 1px; background: #E3E5E9; }

  /* ===== HERO ===== */
  .hero { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0D1A2E; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 900px 600px at 78% 18%, rgba(22,84,140,0.42) 0%, transparent 70%), radial-gradient(ellipse 700px 520px at 12% 88%, rgba(13,138,106,0.20) 0%, transparent 72%); }
  .hero-grid { position: absolute; inset: 0; opacity: 0.05; background-image: linear-gradient(rgba(255,255,255,0.6) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.6) 1px, transparent 1px); background-size: 88px 88px; }
  .hero-content { position: relative; z-index: 1; text-align: center; max-width: 900px; padding: 48px 40px; }
  .hero-badge { display: inline-flex; align-items: center; gap: 9px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.11); border-radius: 100px; padding: 8px 20px; margin-bottom: 40px; }
  .hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #16A97F; animation: pulse-dot 2.4s ease-in-out infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(1.5); } }
  .hero-badge span { font-size: 12.5px; color: rgba(255,255,255,0.68); letter-spacing: 0.04em; }
  .hero h1 { font-family: 'Noto Serif SC', serif; font-size: 52px; font-weight: 900; color: #fff; line-height: 1.28; margin-bottom: 26px; letter-spacing: -0.01em; }
  .hero h1 em { font-style: normal; color: #4FC3A1; }
  .hero-desc { font-size: 18px; color: rgba(255,255,255,0.62); line-height: 1.85; max-width: 660px; margin: 0 auto 52px; }
  .hero-stats { display: flex; justify-content: center; gap: 60px; padding-top: 46px; border-top: 1px solid rgba(255,255,255,0.09); }
  .hero-stat { text-align: center; }
  .hero-stat-value { font-family: 'Noto Serif SC', serif; font-size: 36px; font-weight: 700; color: #fff; line-height: 1.2; }
  .hero-stat-value span { font-size: 17px; color: rgba(255,255,255,0.45); margin-left: 2px; }
  .hero-stat-label { font-size: 12.5px; color: rgba(255,255,255,0.42); margin-top: 8px; }

  /* ===== TIMELINE ===== */
  .timeline { margin-top: 52px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; position: relative; }
  .timeline::before { content: ''; position: absolute; top: 7px; left: 8%; right: 8%; height: 1px; background: #DDE0E5; }
  .tl-node { position: relative; text-align: center; padding: 0 8px; }
  .tl-dot { width: 15px; height: 15px; border-radius: 50%; background: #fff; border: 2px solid #C6CBD2; margin: 0 auto 16px; position: relative; z-index: 1; }
  .tl-node.active .tl-dot { border-color: #16548C; background: #16548C; }
  .tl-year { font-family: 'Noto Serif SC', serif; font-size: 17px; font-weight: 700; color: #111827; margin-bottom: 5px; }
  .tl-node.active .tl-year { color: #16548C; }
  .tl-text { font-size: 12.5px; color: #6B7280; line-height: 1.55; }

  /* ===== CONTEXT ===== */
  .context-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 52px; }
  .context-card { background: #fff; border-radius: 14px; padding: 36px; border: 1px solid rgba(0,0,0,0.055); transition: transform 0.3s, box-shadow 0.3s; }
  .context-card:hover { transform: translateY(-2px); box-shadow: 0 10px 34px rgba(0,0,0,0.06); }
  .context-card-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .context-card h3 { font-family: 'Noto Serif SC', serif; font-size: 19px; font-weight: 700; color: #111827; margin-bottom: 6px; }
  .context-card .cc-tag { font-size: 12px; color: #16548C; font-weight: 600; letter-spacing: 0.06em; margin-bottom: 14px; }
  .context-card p { font-size: 14.5px; color: #6B7280; line-height: 1.8; }

  /* ===== INDUSTRY ===== */
  .industry-section { background: #fff; }
  .industry-grid { display: grid; grid-template-columns: 0.95fr 1.05fr; gap: 52px; margin-top: 52px; align-items: start; }
  .chart-card { background: #F9FAFB; border: 1px solid rgba(0,0,0,0.05); border-radius: 14px; padding: 30px 26px 24px; }
  .chart-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .chart-title { font-size: 14px; font-weight: 600; color: #374151; }
  .chart-unit { font-size: 11.5px; color: #9CA3AF; }
  .chart-note { font-size: 11.5px; color: #9CA3AF; margin-top: 4px; margin-bottom: 22px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 200px; padding-bottom: 26px; position: relative; border-bottom: 1px solid #E5E7EB; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
  .bar-val { font-size: 11.5px; font-weight: 600; color: #374151; margin-bottom: 6px; white-space: nowrap; }
  .bar-fill { width: 100%; max-width: 52px; border-radius: 4px 4px 0 0; background: #16548C; opacity: 0.88; }
  .bar-col.est .bar-fill { background: #16548C; opacity: 0.34; }
  .bar-label { position: absolute; bottom: -24px; font-size: 11.5px; color: #9CA3AF; white-space: nowrap; }
  .chart-foot { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
  .chart-foot-item { font-size: 12px; color: #6B7280; }
  .chart-foot-item strong { color: #0D8A6A; font-weight: 700; font-family: 'Noto Serif SC', serif; font-size: 15px; }

  .policy-list { display: flex; flex-direction: column; gap: 14px; }
  .policy-item { background: #fff; border: 1px solid rgba(0,0,0,0.055); border-radius: 12px; padding: 22px 24px; }
  .policy-title { font-size: 14.5px; font-weight: 600; color: #111827; margin-bottom: 7px; display: flex; align-items: center; gap: 8px; }
  .policy-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .policy-text { font-size: 13.5px; color: #6B7280; line-height: 1.75; }
  .policy-text b { color: #374151; font-weight: 600; }
  .insight-bar { margin-top: 44px; background: #0D1A2E; border-radius: 14px; padding: 30px 36px; display: flex; gap: 22px; align-items: flex-start; }
  .insight-bar-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.14em; color: #4FC3A1; flex-shrink: 0; padding-top: 4px; }
  .insight-bar p { font-size: 15px; color: rgba(255,255,255,0.8); line-height: 1.85; }
  .insight-bar p strong { color: #fff; font-weight: 600; }

  /* ===== CHALLENGE (dark) ===== */
  .challenge-section { background: #0D1A2E; }
  .challenge-section .section-label { color: #4FC3A1; }
  .challenge-section .section-title { color: #fff; }
  .challenge-section .section-subtitle { color: rgba(255,255,255,0.5); }
  .challenge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 52px; }
  .challenge-card { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.075); border-radius: 14px; padding: 34px; transition: background 0.3s, border-color 0.3s; }
  .challenge-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.13); }
  .challenge-num { font-family: 'Noto Serif SC', serif; font-size: 15px; font-weight: 700; color: #4FC3A1; letter-spacing: 0.1em; margin-bottom: 20px; }
  .challenge-card h3 { font-size: 17.5px; font-weight: 600; color: #fff; margin-bottom: 6px; line-height: 1.5; }
  .challenge-card .ck-sub { font-size: 12.5px; color: rgba(255,255,255,0.38); margin-bottom: 18px; }
  .challenge-card p { font-size: 13.5px; color: rgba(255,255,255,0.5); line-height: 1.82; }
  .challenge-card p b { color: rgba(255,255,255,0.78); font-weight: 500; }
  .root-cause { margin-top: 40px; background: rgba(79,195,161,0.07); border: 1px solid rgba(79,195,161,0.16); border-radius: 14px; padding: 34px 38px; }
  .root-cause-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.14em; color: #4FC3A1; margin-bottom: 14px; }
  .root-cause p { font-size: 17px; color: rgba(255,255,255,0.88); line-height: 1.88; font-family: 'Noto Serif SC', serif; }
  .root-cause p strong { color: #4FC3A1; font-weight: 700; }

  /* ===== STRATEGY ===== */
  .strategy-section { background: #fff; }
  .strategy-core { text-align: center; max-width: 760px; margin: 0 auto 54px; }
  .strategy-core .section-subtitle { margin: 0 auto; }
  .strategy-highlight { font-family: 'Noto Serif SC', serif; font-size: 21px; font-weight: 700; color: #16548C; line-height: 1.65; margin-top: 26px; padding: 26px 30px; background: #F1F5F9; border-radius: 12px; }
  .strategy-paths { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: stretch; }
  .strategy-paths > .fade-in { display: flex; flex-direction: column; }
  .strategy-paths > .fade-in > .strategy-path { flex: 1; }
  .strategy-path { border-radius: 14px; padding: 38px; display: flex; flex-direction: column; }
  .strategy-path.p-a { background: #F4F7FB; border: 1px solid rgba(22,84,140,0.13); }
  .strategy-path.p-b { background: #F1F8F5; border: 1px solid rgba(13,138,106,0.14); }
  .strategy-path-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.13em; margin-bottom: 12px; }
  .p-a .strategy-path-label { color: #16548C; }
  .p-b .strategy-path-label { color: #0D8A6A; }
  .strategy-path h3 { font-family: 'Noto Serif SC', serif; font-size: 21px; font-weight: 700; color: #111827; margin-bottom: 14px; line-height: 1.42; }
  .strategy-path > p { font-size: 14px; color: #6B7280; line-height: 1.8; margin-bottom: 18px; }
  .strategy-path ul { list-style: none; margin-top: auto; }
  .strategy-path li { font-size: 13.5px; color: #4B5563; line-height: 1.75; padding: 11px 0 11px 20px; position: relative; border-bottom: 1px solid rgba(0,0,0,0.045); }
  .strategy-path li:last-child { border-bottom: none; }
  .strategy-path li::before { content: ''; position: absolute; left: 0; top: 19px; width: 7px; height: 7px; border-radius: 50%; }
  .p-a li::before { background: #16548C; }
  .p-b li::before { background: #0D8A6A; }
  .strategy-path li b { color: #111827; font-weight: 600; }
  .strategy-conclusion { margin-top: 30px; padding: 26px 32px; background: #F9FAFB; border-radius: 12px; border: 1px solid rgba(0,0,0,0.05); }
  .strategy-conclusion p { font-size: 15px; color: #374151; line-height: 1.85; text-align: center; }
  .strategy-conclusion strong { color: #16548C; }

  /* ===== DIRECTION OVERVIEW ===== */
  .dir-overview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 52px; }
  .dir-overview-card { background: #fff; border-radius: 14px; padding: 32px; border: 1px solid rgba(0,0,0,0.055); cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
  .dir-overview-card:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(0,0,0,0.075); }
  .dir-ov-num { font-family: 'Noto Serif SC', serif; font-size: 30px; font-weight: 900; line-height: 1; margin-bottom: 16px; }
  .dir-ov-title { font-family: 'Noto Serif SC', serif; font-size: 19px; font-weight: 700; color: #111827; margin-bottom: 8px; }
  .dir-ov-sub { font-size: 13px; color: #6B7280; line-height: 1.68; flex: 1; }
  .dir-ov-tag { margin-top: 18px; font-size: 11.5px; color: #9CA3AF; letter-spacing: 0.06em; }

  /* ===== DIRECTION DETAIL ===== */
  .dir-detail { padding: 92px 0; }
  .dir-detail.alt { background: #fff; }
  .dir-detail-inner { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
  .dir-detail-header { display: flex; align-items: flex-start; gap: 24px; margin-bottom: 44px; }
  .dir-detail-num { font-family: 'Noto Serif SC', serif; font-size: 62px; font-weight: 900; line-height: 1; flex-shrink: 0; }
  .dir-detail-header-text { flex: 1; min-width: 0; }
  .dir-detail-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.15em; margin-bottom: 9px; }
  .dir-detail-title { font-family: 'Noto Serif SC', serif; font-size: 30px; font-weight: 700; color: #111827; margin-bottom: 10px; line-height: 1.35; }
  .dir-detail-subtitle { font-size: 15.5px; color: #6B7280; line-height: 1.78; }
  .dir-detail-body { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; }
  .dir-detail-body > * { min-width: 0; }
  .dir-detail-block { margin-bottom: 30px; }
  .dir-detail-block:last-child { margin-bottom: 0; }
  .dir-block-title { font-size: 12px; font-weight: 700; color: #9CA3AF; letter-spacing: 0.13em; text-transform: uppercase; margin-bottom: 15px; }
  .dir-detail-block ul { list-style: none; }
  .dir-detail-block li { font-size: 14px; color: #5B6472; line-height: 1.82; padding-left: 19px; position: relative; margin-bottom: 10px; }
  .dir-detail-block li::before { content: ''; position: absolute; left: 0; top: 10px; width: 5px; height: 5px; border-radius: 50%; background: #C6CBD2; }
  .dir-detail-block li b { color: #1F2937; font-weight: 600; }
  .dir-detail-block > p { font-size: 14.5px; color: #5B6472; line-height: 1.85; }
  .dir-metric-row { display: flex; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
  .dir-metric { flex: 1; min-width: 130px; background: #F7F8FA; border-radius: 10px; padding: 18px 16px; text-align: center; }
  .dir-metric-value { font-family: 'Noto Serif SC', serif; font-size: 21px; font-weight: 700; line-height: 1.25; }
  .dir-metric-label { font-size: 11.5px; color: #9CA3AF; margin-top: 6px; line-height: 1.5; }
  .dir-tool-tag { display: inline-block; font-size: 12px; padding: 5px 13px; border-radius: 100px; background: #F1F3F6; color: #4B5563; font-weight: 500; margin: 3px 5px 3px 0; }
  .dir-significance { background: #F7F8FA; border-radius: 12px; padding: 26px 28px; margin-top: 30px; }
  .dir-significance-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.13em; color: #6B7280; margin-bottom: 11px; }
  .dir-significance p { font-size: 14.5px; color: #374151; line-height: 1.85; }
  .dir-significance p b { color: #111827; font-weight: 600; }
  .dir-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }
  .dir-flow span { font-size: 13px; padding: 7px 14px; border-radius: 8px; background: #fff; border: 1px solid rgba(0,0,0,0.07); color: #4B5563; }
  .dir-flow i { font-style: normal; color: #C6CBD2; font-size: 13px; }

  /* ===== QUOTE DEMO ===== */
  .demo-wrap { margin-top: 32px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; overflow: hidden; }
  .demo-head { padding: 22px 28px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .demo-head h4 { font-size: 15.5px; font-weight: 600; color: #fff; font-family: 'Noto Serif SC', serif; }
  .demo-head .demo-flag { font-size: 11px; color: #F0C070; border: 1px solid rgba(240,192,112,0.4); border-radius: 100px; padding: 3px 11px; white-space: nowrap; }
  .demo-body { display: grid; grid-template-columns: 1fr 1fr; }
  .demo-inputs { padding: 26px 28px; border-right: 1px solid rgba(255,255,255,0.08); }
  .demo-field { margin-bottom: 22px; }
  .demo-field:last-child { margin-bottom: 0; }
  .demo-field-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .demo-field-label { font-size: 12.5px; color: rgba(255,255,255,0.55); letter-spacing: 0.03em; }
  .demo-field-value { font-size: 13.5px; color: #4FC3A1; font-weight: 600; font-family: 'Noto Serif SC', serif; }
  .demo-select { display: flex; flex-wrap: wrap; gap: 7px; }
  .demo-chip { font-size: 12px; padding: 6px 13px; border-radius: 7px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); cursor: pointer; transition: all 0.18s; }
  .demo-chip:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .demo-chip.on { background: rgba(79,195,161,0.15); border-color: rgba(79,195,161,0.45); color: #4FC3A1; font-weight: 600; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.15); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%; background: #4FC3A1; cursor: pointer; border: none; }
  input[type=range]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: #4FC3A1; cursor: pointer; border: none; }

  .inq-fchip.vague { color: #F0C070; background: rgba(240,192,112,0.1); border-color: rgba(240,192,112,0.3); }
  .inq-fchip.miss { color: #E88B84; background: rgba(192,69,60,0.14); border-color: rgba(192,69,60,0.36); }

  .inq-count { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 22px; padding: 22px 28px; border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; background: rgba(255,255,255,0.024); }
  .inq-count-item { flex: 1; min-width: 150px; }
  .inq-count-n { display: block; font-family: 'Noto Serif SC', serif; font-size: 34px; font-weight: 700; line-height: 1.08; color: #fff; font-variant-numeric: tabular-nums; }
  .inq-count-n.dim { color: #E88B84; }
  .inq-count-l { display: block; font-size: 12.5px; color: rgba(255,255,255,0.6); margin-top: 7px; }
  .inq-count-d { display: block; font-size: 11px; color: rgba(255,255,255,0.32); margin-top: 4px; }
  .inq-count-op { font-size: 18px; font-weight: 300; color: rgba(255,255,255,0.18); }

  .inq-absent { margin-top: 18px; padding: 24px 28px; border: 1px solid rgba(192,69,60,0.24); border-radius: 12px; background: rgba(192,69,60,0.05); }
  .inq-absent-head { font-size: 13px; font-weight: 600; color: #E88B84; margin-bottom: 16px; }
  .inq-absent-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .inq-absent-cell { font-size: 11.5px; line-height: 1.45; padding: 11px 12px; border-radius: 8px; border: 1px dashed rgba(192,69,60,0.34); color: rgba(255,255,255,0.62); }
  .inq-absent-cell .inq-fchip-n { display: block; margin-bottom: 5px; }
  .inq-absent-note { font-size: 11.5px; line-height: 1.78; color: rgba(255,255,255,0.42); margin-top: 16px; }
  .inq-absent-note strong { color: rgba(255,255,255,0.74); font-weight: 600; }

  /* ---- STEP 02 风险 ---- */
  .inq-danger { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .inq-danger-card { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.075); border-radius: 11px; padding: 20px 22px; }
  .inq-danger-tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; color: #F0C070; margin-bottom: 9px; }
  .inq-danger-card h5 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 8px; }
  .inq-danger-card p { font-size: 12.5px; color: rgba(255,255,255,0.5); line-height: 1.78; }

  /* ---- STEP 03 规则追溯 ---- */
  .inq-trace-top { display: flex; gap: 28px; flex-wrap: wrap; font-size: 12px; color: rgba(255,255,255,0.42); margin-bottom: 14px; }
  .inq-trace-top b { color: rgba(255,255,255,0.82); font-weight: 600; }
  .inq-trace { border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; overflow: hidden; }
  .inq-trace-row { display: grid; grid-template-columns: 186px 1fr 112px; gap: 20px; padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); align-items: start; }
  .inq-trace-row:last-child { border-bottom: none; }
  .inq-trace-row.v-need { background: rgba(240,192,112,0.032); }
  .inq-trace-row.v-human { background: rgba(192,69,60,0.075); }
  .inq-trace-key { display: flex; flex-direction: column; gap: 4px; }
  .inq-trace-n { font-size: 10px; letter-spacing: 0.08em; color: rgba(255,255,255,0.28); }
  .inq-trace-name { font-size: 13.5px; font-weight: 600; color: rgba(255,255,255,0.92); }
  .inq-trace-state { font-size: 11px; color: rgba(255,255,255,0.38); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .inq-trace-chain { display: grid; grid-template-columns: 104px 1fr; gap: 15px; align-items: start; }
  .rt-rule { font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-align: center; padding: 4px 6px; border-radius: 6px; color: #4FC3A1; background: rgba(79,195,161,0.1); border: 1px solid rgba(79,195,161,0.24); }
  .rt-rule.none { color: rgba(255,255,255,0.36); background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.12); }
  .rt-body { display: flex; flex-direction: column; gap: 6px; }
  .rt-chain { font-size: 12.5px; line-height: 1.72; color: rgba(255,255,255,0.62); }
  .rt-out { font-size: 12.5px; color: rgba(255,255,255,0.9); }
  .rt-out-k { font-size: 10px; letter-spacing: 0.1em; color: rgba(255,255,255,0.28); margin-right: 9px; }
  .rt-note { font-size: 11px; line-height: 1.68; color: rgba(240,192,112,0.66); }
  .inq-trace-verdict { text-align: right; }
  .vt { display: inline-block; font-size: 11px; line-height: 1.4; padding: 4px 10px; border-radius: 6px; border: 1px solid; }
  .vt.auto { color: #7FD9BE; background: rgba(79,195,161,0.1); border-color: rgba(79,195,161,0.28); }
  .vt.need { color: #F0C070; background: rgba(240,192,112,0.1); border-color: rgba(240,192,112,0.32); }
  .vt.human { color: #E88B84; background: rgba(192,69,60,0.16); border-color: rgba(192,69,60,0.42); }

  .inq-trace-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
  .inq-trace-sum-item { padding: 18px 22px; border: 1px solid rgba(255,255,255,0.08); border-radius: 11px; background: rgba(255,255,255,0.022); }
  .inq-trace-sum-item .n { display: block; font-family: 'Noto Serif SC', serif; font-size: 28px; font-weight: 700; line-height: 1.08; }
  .inq-trace-sum-item .l { display: block; font-size: 12px; line-height: 1.65; color: rgba(255,255,255,0.5); margin-top: 8px; }
  .c-auto { color: #7FD9BE; }
  .c-need { color: #F0C070; }
  .c-human { color: #E88B84; }

  /* ---- STEP 04 参数 ---- */
  .inq-params { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; overflow: hidden; }
  .inq-param-col { padding: 26px 28px; }
  .inq-param-col:first-child { border-right: 1px solid rgba(255,255,255,0.09); }
  .inq-effect { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .inq-effect-row { display: grid; grid-template-columns: 72px 18px 1fr; gap: 8px; align-items: baseline; font-size: 12px; }
  .inq-effect-p { font-weight: 600; color: rgba(255,255,255,0.82); }
  .inq-effect-a { color: rgba(255,255,255,0.2); }
  .inq-effect-r { color: rgba(255,255,255,0.48); line-height: 1.62; }
  .inq-effect-note { margin-top: 20px; font-size: 11.5px; line-height: 1.78; color: rgba(255,255,255,0.35); }

  /* ---- STEP 05 成本与报价 ---- */
  .inq-calc { margin-top: 4px; display: grid; grid-template-columns: 1fr 1fr; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; overflow: hidden; }
  .inq-cost { padding: 24px 28px; border-right: 1px solid rgba(255,255,255,0.09); }
  .inq-cost-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.055); font-size: 12.5px; }
  .inq-cost-row:last-child { border-bottom: none; }
  .inq-cost-k { color: rgba(255,255,255,0.45); }
  .inq-cost-v { color: rgba(255,255,255,0.92); font-weight: 600; font-variant-numeric: tabular-nums; }
  .inq-cost-row.sum { border-top: 1px solid rgba(255,255,255,0.14); border-bottom: none; margin-top: 6px; padding-top: 12px; }
  .inq-cost-row.sum .inq-cost-k { color: rgba(255,255,255,0.7); font-weight: 600; }
  .inq-cost-row.sum .inq-cost-v { color: #fff; font-size: 14px; }
  .inq-cost-row.rule .inq-cost-k { font-size: 11px; color: rgba(255,255,255,0.3); font-variant-numeric: tabular-nums; }
  .inq-cost-row.rule .inq-cost-v { color: rgba(255,255,255,0.42); font-weight: 400; font-size: 12px; }

  .inq-out { padding: 24px 28px; background: rgba(79,195,161,0.035); display: flex; flex-direction: column; }
  .inq-quote { text-align: center; padding: 22px 18px; background: rgba(255,255,255,0.05); border-radius: 11px; }
  .inq-quote-label { font-size: 11.5px; color: rgba(255,255,255,0.42); margin-bottom: 8px; letter-spacing: 0.05em; }
  .inq-quote-value { font-family: 'Noto Serif SC', serif; font-size: 34px; font-weight: 700; color: #4FC3A1; line-height: 1.1; }
  .inq-quote-sub { font-size: 11.5px; color: rgba(255,255,255,0.38); margin-top: 9px; line-height: 1.65; }
  .inq-redline { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; padding: 13px 16px; background: rgba(255,255,255,0.04); border-radius: 9px; font-size: 12px; }
  .inq-redline-k { color: rgba(255,255,255,0.45); }
  .inq-redline-v { color: #F0C070; font-weight: 700; font-family: 'Noto Serif SC', serif; font-size: 15px; }

  .inq-bargain { margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.09); }
  .inq-bargain-title { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); margin-bottom: 14px; }
  .inq-verdict { margin-top: 14px; padding: 16px 18px; border-radius: 10px; font-size: 13px; line-height: 1.75; }
  .inq-verdict.pass { background: rgba(79,195,161,0.1); border: 1px solid rgba(79,195,161,0.28); color: rgba(255,255,255,0.85); }
  .inq-verdict.edge { background: rgba(240,192,112,0.09); border: 1px solid rgba(240,192,112,0.3); color: rgba(255,255,255,0.85); }
  .inq-verdict.block { background: rgba(192,69,60,0.14); border: 1px solid rgba(192,69,60,0.4); color: rgba(255,255,255,0.88); }
  .inq-verdict b { font-weight: 700; }
  .inq-alts { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .inq-alt { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; padding: 9px 13px; background: rgba(255,255,255,0.04); border-radius: 8px; color: rgba(255,255,255,0.7); }
  .inq-alt b { color: #4FC3A1; font-weight: 700; white-space: nowrap; }

  /* ---- 演示包文件 ---- */
  .inq-files { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .inq-file { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 14px 20px; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; background: rgba(255,255,255,0.022); text-decoration: none; transition: background 0.18s, border-color 0.18s; }
  .inq-file:hover { background: rgba(79,195,161,0.07); border-color: rgba(79,195,161,0.3); }
  .inq-file.key { background: rgba(79,195,161,0.045); border-color: rgba(79,195,161,0.2); }
  .inq-file-i { font-size: 11px; color: rgba(255,255,255,0.24); font-variant-numeric: tabular-nums; }
  .inq-file-n { display: block; font-size: 12.5px; color: rgba(255,255,255,0.88); }
  .inq-file-d { display: block; font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; }
  .inq-file-go { font-size: 11px; color: #4FC3A1; white-space: nowrap; }

  .inq-flag { display: inline-block; font-size: 11px; color: #F0C070; border: 1px solid rgba(240,192,112,0.4); border-radius: 100px; padding: 3px 12px; margin-left: 10px; vertical-align: middle; }

  @media (max-width: 1100px) {
    .inq-absent-grid { grid-template-columns: repeat(4, 1fr); }
    .inq-line { grid-template-columns: 1fr 250px; }
  }
  @media (max-width: 980px) {
    .j-grid { grid-template-columns: 1fr; }
    .inq-mail-head { grid-template-columns: 1fr; gap: 7px; }
    .inq-line { grid-template-columns: 1fr; gap: 11px; padding: 12px 20px; }
    .inq-mail-head, .inq-mail-attach { padding-left: 20px; padding-right: 20px; }
    .inq-line-txt { grid-template-columns: 1fr; row-gap: 4px; }
    .inq-line-no, .inq-line-en, .inq-line-zh { grid-column: 1; grid-row: auto; }
    .inq-line-no { padding-top: 0; }
    .inq-danger { grid-template-columns: 1fr; }
    .inq-params, .inq-calc { grid-template-columns: 1fr; }
    .inq-param-col:first-child, .inq-cost { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.09); }
    .inq-trace-row { grid-template-columns: 1fr; gap: 12px; }
    .inq-trace-verdict { text-align: left; }
    .inq-trace-chain { grid-template-columns: 92px 1fr; gap: 12px; }
    .inq-trace-sum { grid-template-columns: 1fr; }
    .inq-files { grid-template-columns: 1fr; }
    .inq-count { gap: 14px; }
  }
  @media (max-width: 620px) {
    .inq-absent-grid { grid-template-columns: repeat(2, 1fr); }
  }
